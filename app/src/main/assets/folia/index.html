<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; object-src 'none'; worker-src 'none'">
<style>
/* Android WebView may resolve the document's percentage height to zero even
   with a nonzero viewport. Anchor the stage to the viewport, not that document. */
html,body{margin:0;padding:0;overflow:hidden;background:#070b12}
body{touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden}
canvas{display:block}
</style>
</head><body><div id="stage" aria-hidden="true"></div><script src="lumiere.js"></script></body></html>
