name: Android validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visualizer/package-lock.json
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Tests, Lint and unsigned release
        run: bash ./gradlew --console=plain testDebugUnitTest lintDebug assembleRelease -PciUnsigned=true
      - name: Worker tests and dependency audit
        run: |
          node --test worker/worker.test.mjs
          npm audit --prefix worker --registry=https://registry.npmjs.org
          npm audit --prefix visualizer --registry=https://registry.npmjs.org
      - name: Folia clock and WebGL tests
        working-directory: visualizer
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- ../app/src/main/assets/folia bundle.properties
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-validation
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/performance/
            app/build/reports/v110-screens/
            app/build/folia-screens/
            visualizer/test-results/
